sampling:
  temperature: 0.6
  top_p: 0.95
  max_tokens: 3072
  n: 20

scoring:
  model: "gpt-5-mini"
  reasoning_effort: "medium"
  safety_identifier: "SPAR_FX"
  api_key_env: "OPENAI_API_KEY"
  max_completion_tokens: 2048
  max_concurrent: 400

vllm:
  tensor_parallel_size: 1

slurm:
  partition: "dev"
  max_concurrent: 14
  timeout: "8:00:00"
  job_name: "hbsr-dpo-sysprompt"
  gpus_per_node: 8
  cpus_per_node: 64

paths:
  prompts: "data/harmbench_strongreject/prompts.jsonl"
